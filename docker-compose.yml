version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campusbite-db
    restart: always
    environment:
      POSTGRES_DB: campusbite_db
      POSTGRES_USER: campusbite
      POSTGRES_PASSWORD: campusbite_secure_password
    ports:
      - "5432:5432"
    volumes:
      - campusbite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusbite -d campusbite_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusbite-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://campusbite:campusbite_secure_password@db:5432/campusbite_db
      - SYNC_DATABASE_URL=postgresql://campusbite:campusbite_secure_password@db:5432/campusbite_db
      - SECRET_KEY=campusbite-super-secret-production-random-key-64chars
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusbite-frontend
    restart: always
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  campusbite_pgdata:

